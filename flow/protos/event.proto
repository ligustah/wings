syntax = "proto3";

package wings.flow.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

import "flow/protos/data.proto";

option go_package = "github.com/ligustah/wings/flow/protos";

/*
  There are various kinds of events that are emitted during execution of a
  workflow. Each has a timestamp and a serial, ensuring that deterministic
  behavior can be verified.

  Every event also names the thread it belongs to. In the project this schema
  came from, threads were a map<string, Thread> inside the run and the whole run
  was rewritten on each checkpoint; here the run IS the stream of its events, so
  an event has to say where it belongs rather than being filed by its position
  in a blob. That is what lets a checkpoint be an append of one record instead
  of a rewrite of everything so far.
 */
message Event {
  google.protobuf.Timestamp timestamp = 1;

  // Position of this event within its thread, counting from zero. Replay
  // consumes a thread's events in this order and compares each against what the
  // workflow function is doing now.
  uint64 serial = 2;

  // The run that produced this event. Events from an abandoned attempt stay in
  // the stream, so this is how a reader tells them apart.
  uint64 attempt = 3;

  // The thread this event belongs to. "main" is the thread the workflow
  // function itself runs on; forked threads are named "<parent>.<n>".
  string thread_id = 4;

  oneof payload {
    JoinEvent join = 20;
    CallEvent call = 21;
    ForkEvent fork = 22;
    SleepEvent sleep = 23;
    GetTimeEvent time = 24;
    ReturnEvent return = 25;
    RunStartEvent run_start = 26;
    RunEndEvent run_end = 27;
    ChannelSendEvent channel_send = 28;
    ChannelRecvEvent channel_recv = 29;
    EffectEvent effect = 30;
    WaitInterruptedEvent interrupted = 31;
  }
}

message CallEvent {
  string name = 1;
  Data params = 2;
}

// ForkEvent is a thread starting another. It carries the work the new thread
// is to do, so a reader of the parent's stream alone — an executor placing
// threads on machines — can start it: the function's name and its encoded
// input for a thread that runs one function, and neither for a thread that
// runs a piece of the run's own code, which only the process holding that
// code can run.
message ForkEvent {
  // The parent thread that is executing the fork
  string parent_thread_id = 1;

  // The thread id of the new thread
  string thread_id = 2;

  // The function the new thread runs, and its input. Empty for a thread that
  // runs a body of run code rather than a defined function.
  string function = 3;
  Data input = 4;
}

// JoinEvent is a thread taking another's result, after which the other
// thread is over: the result is the parent's now, and a replay of the parent
// never starts the child again.
message JoinEvent {
  // The thread id that is being joined
  string thread_id = 1;

  // What the joined thread produced.
  Result result = 2;
}

message SleepEvent {
  // The duration for which the workflow is sleeping
  google.protobuf.Duration duration = 1;
}

message GetTimeEvent {
  // The time at which the event was emitted
  google.protobuf.Timestamp time = 1;
}

// WaitInterruptedEvent is a wait — a join, a receive, a send, a close, a
// sleep — that a context the body made itself cut short: a timeout it set on
// the wait, a cancel it called. The body went on from there with the
// context's error, and the next attempt has to go on the same way, at once,
// rather than wait again for what the body already gave up on — or find
// that this time the wait would have completed, and diverge. A wait the
// thread's OWN context cut short is not recorded: the attempt is over.
message WaitInterruptedEvent {
  // Which wait: "join", "recv", "send", "close" or "sleep", checked on
  // replay like every other event's shape.
  string wait = 1;

  // Why: the context's error.
  InterruptCause cause = 2;
}

enum InterruptCause {
  INTERRUPT_CAUSE_UNKNOWN = 0;
  INTERRUPT_CAUSE_CANCELED = 1;
  INTERRUPT_CAUSE_DEADLINE_EXCEEDED = 2;
}

message EffectEvent {
  // What the function passed to Context.Effect returned: its value, or its
  // error. Recorded so a replay hands back the same outcome instead of
  // running the function again.
  Result result = 1;
}

message ReturnEvent {
  // The result of the call
  Result result = 1;

  // The serial of the call event for which this is the return
  uint64 call_serial = 2;
}

/*
  Channels let threads of one workflow pass typed values to each other. Two
  events, because a send and a receive are separately observable and only one of
  them is naturally deterministic.

  A thread's nth send on a channel always carries the same value, because the
  thread's own execution is deterministic — so a send needs recording only for
  WHEN it completed, which on an unbuffered channel depends on somebody
  receiving. A receive is the opposite: which value arrives first is decided by
  the operating system's scheduler, and nothing about the workflow determines
  it. So the receive records WHICH item it took, and a replay waits for exactly
  that one rather than taking whatever happens to be there.
 */
message ChannelSendEvent {
  // The channel's name, derived from the thread that created it.
  string channel = 1;

  // This thread's nth send on this channel, counting from zero. Together with
  // the thread id it identifies one item for a receive to name.
  uint64 seq = 2;

  // What was sent. Not needed to replay — the sender recomputes it — but a
  // history that shows what actually flowed is worth the bytes.
  Data value = 3;

  // Set when this closed the channel rather than sending. A close is a send in
  // every respect that matters here: it is a thing one thread does that another
  // observes, and it has to be ordered against the sends around it.
  bool closed = 4;
}

message ChannelRecvEvent {
  string channel = 1;

  // Which thread's send this took, and which of that thread's sends. Empty and
  // zero when the receive observed a closed channel instead.
  string from_thread_id = 2;
  uint64 from_seq = 3;

  // Set when the receive found the channel closed and drained, which is the
  // one outcome that yields no value.
  bool closed = 4;

  // What was received. Needed to replay: the sender may be a thread that has
  // since been joined, and a joined thread is not run again.
  Data value = 5;
}

enum StartReason {
  START_REASON_UNKNOWN = 0;
  START_REASON_INIT = 1;
  START_REASON_RESUME = 2;
  START_REASON_RETRY = 3;
}

// RunStartEvent opens an attempt of a thread. Every thread has its own stream
// and its own attempts; workflow_name is the run, instance_id the thread. It carries everything needed to begin, so a
// reader of the stream alone can tell what was run and with what.
message RunStartEvent {
  uint64 attempt = 1;
  StartReason reason = 2;
  string workflow_name = 3;
  string instance_id = 4;
  uint64 version = 5;
  Data input = 6;

  // The function the thread runs, for a thread that runs one; empty for a
  // run's own body.
  string function = 7;
}

// RunEndEvent closes an attempt, and says what became of it.
message RunEndEvent {
  WorkflowStatus status = 1;
  Result result = 2;

  // When the next attempt should begin, for a run that is backing off or
  // suspended. Unset otherwise.
  google.protobuf.Timestamp scheduled_for = 3;
}

/**
* The `WorkflowStatus` enum represents the status of a workflow run.
*/
enum WorkflowStatus {
  // The status of the workflow is unknown. This is the default value.
  WORKFLOW_STATUS_UNKNOWN = 0;

  // The workflow is currently running.
  WORKFLOW_STATUS_RUNNING = 1;

  // The workflow has successfully finished.
  WORKFLOW_STATUS_COMPLETED = 2;

  // The workflow has permanently failed to complete.
  WORKFLOW_STATUS_FAILED = 3;

  // The workflow is temporarily on hold.
  WORKFLOW_STATUS_SUSPENDED = 4;

  // The workflow is in backoff state due to a failed attempt.
  WORKFLOW_STATUS_BACKOFF = 5;

  // The workflow has been added to a queue, and is waiting to get executed.
  WORKFLOW_STATUS_QUEUED = 6;

  // The workflow has been cancelled.
  WORKFLOW_STATUS_CANCELLED = 7;
}
