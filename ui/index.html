<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wings</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --border: #262c36; --fg: #d7dde5;
    --muted: #8b949e; --accent: #4c9aff; --good: #3fb950; --bad: #f85149;
    --warn: #d29922; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--fg); font-weight: 600; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 53px); }
  .side { border-right: 1px solid var(--border); overflow-y: auto; }
  .detail { overflow-y: auto; padding: 16px; }
  section { margin: 0; }
  .sec-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); padding: 12px 16px 6px; position: sticky; top: 0;
    background: var(--bg); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr.run { cursor: pointer; }
  tr.run:hover { background: var(--panel); }
  tr.run.sel { background: #1c2530; }
  .mono { font-family: var(--mono); }
  .status { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border); }
  .status.completed { color: var(--good); border-color: #1f4428; }
  .status.failed { color: var(--bad); border-color: #5a2321; }
  .status.running, .status.suspended, .status.backoff { color: var(--warn); border-color: #5a4620; }
  .empty { color: var(--muted); padding: 16px; font-style: italic; }
  .thread { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; background: var(--panel); }
  .thread-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); }
  .thread-head .id { font-family: var(--mono); font-weight: 600; }
  .thread-head .fn { color: var(--muted); font-size: 12px; }
  .thread-head .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
  .events { padding: 4px 0; }
  .ev { display: grid; grid-template-columns: 44px 90px 1fr; gap: 10px; padding: 3px 12px;
    font-size: 12.5px; align-items: baseline; }
  .ev:hover { background: var(--bg); }
  .ev .seq { color: var(--muted); font-family: var(--mono); text-align: right; }
  .ev .kind { font-family: var(--mono); }
  .ev .kind.call, .ev .kind.effect { color: var(--accent); }
  .ev .kind.fork, .ev .kind.join { color: #c778dd; }
  .ev .kind.send, .ev .kind.recv, .ev .kind.select { color: var(--good); }
  .ev .kind.interrupted { color: var(--warn); }
  .ev .detail { color: var(--fg); font-family: var(--mono); word-break: break-word; }
  .ev .err { color: var(--bad); }
  .hint { color: var(--muted); font-size: 13px; }
  .dead { color: var(--bad); }
  .draining { color: var(--warn); }
  .more { margin: 6px 12px 10px; background: var(--bg); color: var(--accent);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
    cursor: pointer; font: inherit; font-size: 12px; }
  .more:hover { border-color: var(--accent); }
  .more:disabled { color: var(--muted); cursor: default; border-color: var(--border); }
  .summary { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 4px 12px 6px;
    border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--muted);
    font-family: var(--mono); }
  .summary .n { color: var(--fg); }
  .grp-head { cursor: pointer; }
  .grp-head:hover { background: var(--bg); }
  .grp-head .kind { font-weight: 600; }
  .grp-body { border-left: 2px solid var(--border); }
  .node.child { border-left: 1px solid var(--border); padding-left: 12px; }
  .thread-head { cursor: pointer; }
  .thread-head .tog { color: var(--muted); font-family: var(--mono); width: 12px; }
  .fork-link { color: #c778dd; cursor: pointer; text-decoration: none; border-bottom: 1px dotted #c778dd; }
  .fork-link:hover { color: var(--fg); }
</style>
</head>
<body>
<header>
  <h1>wings</h1>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="side">
    <section>
      <div class="sec-title">Runs</div>
      <table><tbody id="runs"></tbody></table>
    </section>
    <section>
      <div class="sec-title">Workers</div>
      <table><tbody id="workers"></tbody></table>
    </section>
    <section>
      <div class="sec-title">Pending</div>
      <table><tbody id="pending"></tbody></table>
    </section>
  </div>
  <div class="detail" id="detail">
    <p class="hint">Select a run to see its threads and event timeline.</p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const PAGE = 500;
let selected = null;
let threads = [];   // current thread ids in the detail, in order
const cursor = {};  // thread id -> { next, done, terminal, loaded, loading, attempts }

async function getJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + ": " + r.status);
  return r.json();
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function statusEl(s) {
  return `<span class="status ${esc(s)}">${esc(s)}</span>`;
}

async function refreshCluster() {
  try {
    const st = await getJSON("api/status");
    $("chips").innerHTML = [
      ["target", st.target], ["workers", st.workers], ["outstanding", st.outstanding],
      ["dir", st.dir],
    ].map(([k, v]) => `<span class="chip">${k} <b>${esc(v)}</b></span>`).join("");
  } catch (e) { /* transient */ }

  try {
    const ws = await getJSON("api/workers");
    $("workers").innerHTML = ws.length ? ws.map(w => `<tr>
      <td class="mono">${esc(w.id)}</td>
      <td>${esc(w.kind)}</td>
      <td>${w.dead ? '<span class="dead">dead</span>' : w.draining ? '<span class="draining">draining</span>' : "load " + w.load}</td>
    </tr>`).join("") : `<tr><td class="empty" colspan="3">none</td></tr>`;
  } catch (e) {}

  try {
    const ps = await getJSON("api/pending");
    $("pending").innerHTML = ps.length ? ps.map(p => `<tr>
      <td class="mono">${esc(p.run || p.id)}</td>
      <td>${esc(p.fn || "")}</td>
      <td>${p.blocked ? "blocked" : p.placed ? "placed" : "queued"}</td>
    </tr>`).join("") : `<tr><td class="empty" colspan="3">none</td></tr>`;
  } catch (e) {}
}

async function refreshRuns() {
  try {
    const runs = await getJSON("api/runs");
    $("runs").innerHTML = runs.length ? runs.map(r => `<tr class="run ${r.run === selected ? "sel" : ""}" data-run="${esc(r.run)}">
      <td class="mono">${esc(r.run)}</td>
      <td>${statusEl(r.status)}</td>
    </tr>`).join("") : `<tr><td class="empty" colspan="2">no runs recorded</td></tr>`;
    for (const tr of $("runs").querySelectorAll("tr.run")) {
      tr.onclick = () => selectRun(tr.dataset.run);
    }
  } catch (e) {}
}

async function selectRun(run) {
  selected = run;
  threads = [];
  for (const k in cursor) delete cursor[k];
  for (const tr of $("runs").querySelectorAll("tr.run")) {
    tr.classList.toggle("sel", tr.dataset.run === run);
  }
  await buildDetail();
}

function isTerminal(s) { return s === "completed" || s === "failed"; }

// A thread's parent is the prefix before its last "." (main.3.1's is main.3), so
// threads form a fork tree. Order it top-down, depth-first, roots first.
function threadTree(infos) {
  const byId = {}, kids = {}, roots = [];
  for (const t of infos) byId[t.id] = t;
  for (const t of infos) {
    if (t.parent && byId[t.parent]) (kids[t.parent] = kids[t.parent] || []).push(t.id);
    else roots.push(t.id);
  }
  const order = [];
  const walk = (id, depth) => {
    order.push({ id, depth, info: byId[id] });
    for (const k of (kids[id] || []).sort()) walk(k, depth + 1);
  };
  for (const r of roots.sort()) walk(r, 0);
  return order;
}

function nodeShell(n) {
  const t = n.info;
  return `<div class="node${n.depth ? " child" : ""}" data-thread="${esc(t.id)}" style="margin-left:${n.depth * 22}px">
    <div class="thread">
      <div class="thread-head">
        <span class="tog">▾</span>
        <span class="id">${esc(t.id)}</span>
        ${t.fn ? `<span class="fn">${esc(t.fn)}</span>` : ""}
        <span class="st">${statusEl(t.status)}</span>
        <span class="meta"></span>
      </div>
      <div class="summary"></div>
      <div class="body">
        <div class="events"></div>
        <div class="more-wrap"></div>
      </div>
    </div>
  </div>`;
}

function threadEl(id) {
  return $("detail").querySelector(`.node[data-thread="${CSS.escape(id)}"]`);
}

// The whole history is never held: each thread pages its events from an offset
// cursor, forks nest as a tree, and long runs of one event kind collapse into a
// single expandable row so a channel-heavy sweep reads as structure, not noise.
async function buildDetail() {
  if (!selected) return;
  let detail;
  try {
    detail = await getJSON("api/runs/" + encodeURIComponent(selected));
  } catch (e) {
    $("detail").innerHTML = `<p class="hint">Could not load ${esc(selected)}: ${esc(e.message)}</p>`;
    return;
  }
  const infos = detail.threads || [];
  threads = infos.map(t => t.id);
  const order = threadTree(infos);
  $("detail").innerHTML = `<h2 class="mono" style="margin:0 0 14px">${esc(detail.run)}</h2>` + order.map(nodeShell).join("");
  for (const n of order) {
    const t = n.info;
    cursor[t.id] = { next: 0, done: false, terminal: isTerminal(t.status), loaded: 0, loading: false,
      attempts: t.attempts, events: [], expanded: new Set(), open: n.depth === 0 };
    wireNode(t.id);
    applyOpen(t.id);
    setMore(t.id);
    if (cursor[t.id].open) await loadMore(t.id);
  }
}

function wireNode(id) {
  const el = threadEl(id);
  if (!el) return;
  el.querySelector(".thread-head").onclick = async () => {
    const c = cursor[id];
    c.open = !c.open;
    applyOpen(id);
    if (c.open && c.loaded === 0 && !c.done) await loadMore(id);
  };
}

function applyOpen(id) {
  const el = threadEl(id);
  if (!el) return;
  const c = cursor[id];
  const body = el.querySelector(".body");
  if (body) body.hidden = !c.open;
  const tog = el.querySelector(".tog");
  if (tog) tog.textContent = c.open ? "▾" : "▸";
}

async function loadMore(id) {
  const c = cursor[id];
  if (!c || c.loading || (c.done && c.terminal)) return;
  c.loading = true;
  try {
    const page = await getJSON(`api/runs/${encodeURIComponent(selected)}/threads/${encodeURIComponent(id)}?from=${c.next}&limit=${PAGE}`);
    const evs = page.events || [];
    for (const ev of evs) c.events.push(ev);
    c.next = page.next; c.done = page.done; c.loaded += evs.length;
    renderEvents(id);
  } catch (e) { /* transient */ }
  finally { c.loading = false; setMore(id); }
}

function chanOf(ev) {
  if (ev.kind === "send" || ev.kind === "recv") {
    const m = /^(?:close\s+)?([^\s#]+)/.exec(ev.detail || "");
    return m ? m[1] : "";
  }
  return "";
}

function evRow(ev) {
  let detail = esc(ev.detail);
  if (ev.kind === "fork") {
    const child = (ev.detail || "").split(" ")[0];
    detail = `<a class="fork-link" data-to="${esc(child)}">${esc(ev.detail)}</a>`;
  }
  return `<div class="ev">
    <span class="seq">${ev.seq}</span>
    <span class="kind ${esc(ev.kind)}">${esc(ev.kind)}</span>
    <span class="detail">${detail}${ev.error ? ` <span class="err">${esc(ev.error)}</span>` : ""}</span>
  </div>`;
}

// Consecutive events of one kind on one channel collapse into an expandable
// group; an event with an error stays its own row so a failure is never hidden.
function renderEvents(id) {
  const el = threadEl(id);
  if (!el) return;
  const c = cursor[id];
  const groups = [];
  for (const ev of c.events) {
    const key = ev.kind + "|" + chanOf(ev);
    const last = groups[groups.length - 1];
    if (last && last.key === key && !ev.error && !last.items[0].error) last.items.push(ev);
    else groups.push({ key, kind: ev.kind, chan: chanOf(ev), gid: key + "|" + ev.seq, items: [ev] });
  }
  const cont = el.querySelector(".events");
  cont.innerHTML = groups.map(g => {
    if (g.items.length === 1) return evRow(g.items[0]);
    const first = g.items[0], last = g.items[g.items.length - 1];
    const open = c.expanded.has(g.gid);
    const label = `${esc(g.kind)}${g.chan ? " " + esc(g.chan) : ""} ×${g.items.length}`;
    return `<div class="grp" data-gid="${esc(g.gid)}">
      <div class="ev grp-head">
        <span class="seq">${first.seq}–${last.seq}</span>
        <span class="kind ${esc(g.kind)}">${open ? "▾" : "▸"} ${label}</span>
        <span class="detail hint">${esc(first.detail)} … ${esc(last.detail)}</span>
      </div>
      <div class="grp-body"${open ? "" : " hidden"}>${g.items.map(evRow).join("")}</div>
    </div>`;
  }).join("");
  for (const gh of cont.querySelectorAll(".grp-head")) {
    gh.onclick = () => {
      const gid = gh.parentElement.dataset.gid;
      if (c.expanded.has(gid)) c.expanded.delete(gid); else c.expanded.add(gid);
      renderEvents(id);
    };
  }
  for (const a of cont.querySelectorAll(".fork-link")) {
    a.onclick = async () => {
      const to = a.dataset.to, cc = cursor[to], tel = threadEl(to);
      if (cc && !cc.open) { cc.open = true; applyOpen(to); if (cc.loaded === 0 && !cc.done) await loadMore(to); }
      if (tel) tel.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  }
  const sum = el.querySelector(".summary");
  if (sum) {
    const counts = {};
    for (const ev of c.events) counts[ev.kind] = (counts[ev.kind] || 0) + 1;
    const parts = Object.keys(counts).sort().map(k => `${esc(k)} <span class="n">${counts[k]}</span>`);
    sum.innerHTML = parts.length ? parts.join(" · ") + (c.done ? "" : " · …") : (c.done ? '<span class="hint">no events</span>' : "");
  }
}

function setMore(id) {
  const el = threadEl(id);
  if (!el) return;
  const c = cursor[id];
  const meta = el.querySelector(".meta");
  if (meta) meta.textContent = `${c.loaded}${c.done ? "" : "+"} events${c.attempts > 1 ? " · attempt " + c.attempts : ""}`;
  const wrap = el.querySelector(".more-wrap");
  if (!wrap) return;
  if (c.done && c.terminal) { wrap.innerHTML = ""; return; }
  wrap.innerHTML = `<button class="more">${c.done ? "Load newer" : "Load more"}</button>`;
  wrap.querySelector("button").onclick = () => loadMore(id);
}

// A tick updates the selected run's thread statuses without re-reading loaded
// events; it rebuilds only when the thread set itself changed (a new fork).
async function refreshHeads() {
  if (!selected) return;
  let detail;
  try {
    detail = await getJSON("api/runs/" + encodeURIComponent(selected));
  } catch (e) { return; }
  const infos = detail.threads || [];
  const ids = infos.map(t => t.id);
  if (ids.length !== threads.length || ids.some((v, i) => v !== threads[i])) {
    await buildDetail();
    return;
  }
  for (const t of infos) {
    const el = threadEl(t.id);
    if (!el) continue;
    const st = el.querySelector(".st");
    if (st) st.innerHTML = statusEl(t.status);
    const c = cursor[t.id];
    if (c) { c.terminal = isTerminal(t.status); c.attempts = t.attempts; setMore(t.id); }
  }
}

async function tick() {
  await Promise.all([refreshCluster(), refreshRuns(), refreshHeads()]);
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
