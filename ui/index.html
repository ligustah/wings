<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wings</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --border: #262c36; --fg: #d7dde5;
    --muted: #8b949e; --accent: #4c9aff; --good: #3fb950; --bad: #f85149;
    --warn: #d29922; --fork: #c778dd;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--bg); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--fg); font-weight: 600; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 0; height: calc(100vh - 53px); }
  .side { border-right: 1px solid var(--border); overflow-y: auto; }
  .detail { overflow: hidden; display: flex; flex-direction: column; }
  section { margin: 0; }
  .sec-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--muted); padding: 12px 16px 6px; position: sticky; top: 0;
    background: var(--bg); z-index: 2; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr.run { cursor: pointer; }
  tr.run:hover { background: var(--panel); }
  tr.run.sel { background: #1c2530; }
  .mono { font-family: var(--mono); }
  .status { font-size: 11px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--border); white-space: nowrap; }
  .status.completed { color: var(--good); border-color: #1f4428; }
  .status.failed { color: var(--bad); border-color: #5a2321; }
  .status.running, .status.suspended, .status.backoff { color: var(--warn); border-color: #5a4620; }
  .empty { color: var(--muted); padding: 16px; font-style: italic; }
  .hint { color: var(--muted); font-size: 13px; }
  .dead { color: var(--bad); }
  .draining { color: var(--warn); }

  /* Detail: a top-down fork diagram over a selected thread's timeline. */
  .diagram-title { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px 4px; }
  .diagram-title h2 { font-size: 15px; margin: 0; }
  .diagram-title .sub { color: var(--muted); font-size: 12px; }
  .diagram { overflow: auto; padding: 8px 16px 20px; border-bottom: 1px solid var(--border);
    flex: 0 0 auto; max-height: 52%; }

  /* CSS fork tree: parent above, children below, connected by lines. */
  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
  .tree { display: flex; justify-content: flex-start; min-width: max-content; }
  .tree ul { display: flex; padding-top: 22px; position: relative; }
  .tree li { position: relative; padding: 22px 10px 0; display: flex;
    flex-direction: column; align-items: center; }
  .tree li::before, .tree li::after { content: ""; position: absolute; top: 0;
    height: 22px; border-top: 2px solid var(--border); width: 50%; }
  .tree li::before { right: 50%; }
  .tree li::after { left: 50%; border-left: 2px solid var(--border); }
  .tree li:only-child::after, .tree li:only-child::before { display: none; }
  .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
  .tree li:last-child::before { border-right: 2px solid var(--border); }
  .tree ul::before { content: ""; position: absolute; top: 0; left: 50%;
    border-left: 2px solid var(--border); width: 0; height: 22px; }
  .tree > li { padding-top: 0; }
  .tree > li::before, .tree > li::after { display: none; }

  .box { border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
    padding: 7px 11px; min-width: 130px; cursor: pointer; text-align: left;
    border-top: 3px solid var(--border); transition: border-color .1s, background .1s; }
  .box:hover { background: #1c2330; }
  .box.sel { background: #1c2530; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .box.completed { border-top-color: var(--good); }
  .box.failed { border-top-color: var(--bad); }
  .box.running, .box.suspended, .box.backoff { border-top-color: var(--warn); }
  .box .id { font-family: var(--mono); font-weight: 600; font-size: 12.5px; }
  .box .fn { color: var(--muted); font-size: 11.5px; }
  .box .row2 { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .box .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .box.completed .dot { background: var(--good); }
  .box.failed .dot { background: var(--bad); }
  .box.running .dot, .box.suspended .dot, .box.backoff .dot { background: var(--warn); }
  .box .att { color: var(--warn); font-size: 11px; }

  .cluster { border-style: dashed; }
  .cluster .count { font-weight: 700; }
  .cluster .bars { display: flex; gap: 2px; margin-top: 4px; }
  .cluster .bar { height: 4px; border-radius: 2px; }
  .cluster .bar.good { background: var(--good); }
  .cluster .bar.bad { background: var(--bad); }
  .cluster .bar.warn { background: var(--warn); }
  .cluster-collapse { font-size: 11px; color: var(--muted); cursor: pointer;
    border: 1px dashed var(--border); border-radius: 6px; padding: 3px 8px; background: var(--panel); }
  .cluster-collapse:hover { color: var(--fg); border-color: var(--fork); }

  /* Timeline of the selected thread. */
  .timeline { flex: 1 1 auto; overflow-y: auto; padding: 10px 16px 24px; }
  .tl-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .tl-head .id { font-family: var(--mono); font-weight: 600; font-size: 14px; }
  .tl-head .fn { color: var(--muted); }
  .summary { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted);
    font-size: 11.5px; font-family: var(--mono); margin-left: auto; }
  .summary .n { color: var(--fg); }
  .events { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .ev { display: grid; grid-template-columns: 70px 96px 1fr; gap: 10px; padding: 3px 12px;
    font-size: 12.5px; align-items: baseline; border-bottom: 1px solid var(--border); }
  .ev:last-child { border-bottom: 0; }
  .ev:hover { background: var(--bg); }
  .ev .seq { color: var(--muted); font-family: var(--mono); text-align: right; }
  .ev .kind { font-family: var(--mono); }
  .ev .kind.call, .ev .kind.effect { color: var(--accent); }
  .ev .kind.fork, .ev .kind.join { color: var(--fork); }
  .ev .kind.send, .ev .kind.recv, .ev .kind.select { color: var(--good); }
  .ev .kind.interrupted { color: var(--warn); }
  .ev .detail { color: var(--fg); font-family: var(--mono); word-break: break-word; }
  .ev .err { color: var(--bad); }
  .grp-head { cursor: pointer; }
  .grp-head:hover { background: var(--bg); }
  .grp-head .kind { font-weight: 600; }
  .grp-body { background: var(--bg); }
  .fork-link { color: var(--fork); cursor: pointer; text-decoration: none; border-bottom: 1px dotted var(--fork); }
  .fork-link:hover { color: var(--fg); }
  .more { margin: 8px 0 0; background: var(--bg); color: var(--accent);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px;
    cursor: pointer; font: inherit; font-size: 12px; }
  .more:hover { border-color: var(--accent); }
  .more:disabled { color: var(--muted); cursor: default; border-color: var(--border); }

  /* A recorded value shown under an event. */
  .val { margin-top: 2px; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; max-height: 7.5em; overflow: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; }
  .val .tag { color: var(--accent); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; margin-right: 6px; }

  /* View toggle in the timeline head. */
  .views { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .views button { background: var(--panel); color: var(--muted); border: 0; padding: 3px 11px;
    font: inherit; font-size: 12px; cursor: pointer; }
  .views button + button { border-left: 1px solid var(--border); }
  .views button.on { background: #1c2530; color: var(--fg); }

  /* Horizontal trace: time on the x-axis, one lane per thread. */
  .trace { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow-x: auto; }
  .ruler { position: relative; height: 18px; margin-left: var(--lane-label, 150px);
    border-bottom: 1px solid var(--border); min-width: 200px; }
  .ruler .tick { position: absolute; top: 0; height: 18px; border-left: 1px solid var(--border);
    padding-left: 4px; font-size: 10px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
  .lane { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); min-height: 26px; }
  .lane:last-child { border-bottom: 0; }
  .lane .label { flex: 0 0 var(--lane-label, 150px); width: var(--lane-label, 150px);
    padding: 4px 8px; font-family: var(--mono); font-size: 12px; cursor: pointer;
    border-right: 1px solid var(--border); position: sticky; left: 0; background: var(--panel);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; }
  .lane .label:hover { color: var(--accent); }
  .lane .label.sel { background: #1c2530; }
  .lane .label .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); margin-right: 5px; vertical-align: middle; }
  .lane.completed .label .dot { background: var(--good); }
  .lane.failed .label .dot { background: var(--bad); }
  .lane.running .label .dot, .lane.suspended .label .dot, .lane.backoff .label .dot { background: var(--warn); }
  .track { position: relative; flex: 1 1 auto; min-width: 200px; }
  .span { position: absolute; top: 6px; height: 14px; border-radius: 3px; background: var(--accent);
    opacity: .8; cursor: pointer; min-width: 2px; }
  .span:hover, .span.sel { opacity: 1; box-shadow: 0 0 0 1px var(--fg); }
  .span.running { background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 10px); }
  .span.bad { background: var(--bad); }
  .mark { position: absolute; top: 7px; width: 11px; height: 11px; margin-left: -5px;
    transform: rotate(45deg); cursor: pointer; border: 1px solid var(--bg); }
  .mark:hover, .mark.sel { box-shadow: 0 0 0 2px var(--fg); z-index: 2; }
  .mark.effect { background: var(--accent); border-radius: 2px; transform: none; top: 8px; width: 9px; height: 9px; }
  .mark.fork, .mark.join { background: var(--fork); }
  .mark.send, .mark.recv, .mark.select { background: var(--good); }
  .mark.interrupted, .mark.sleep { background: var(--warn); }
  .mark.err { background: var(--bad); }
  .trace-more { color: var(--muted); font-size: 11.5px; padding: 6px 10px; }

  /* Detail strip for a clicked span or marker. */
  .insp { border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
    margin-top: 10px; padding: 9px 12px; font-size: 12.5px; }
  .insp .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
  .insp .k { font-family: var(--mono); font-weight: 600; }
  .insp .t { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .insp .d { font-family: var(--mono); color: var(--fg); word-break: break-word; }
  .insp pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono);
    font-size: 11.5px; color: var(--muted); background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 6px 8px; max-height: 14em; overflow: auto; }
  .insp .close { float: right; color: var(--muted); cursor: pointer; background: none; border: 0; font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1>wings</h1>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="side">
    <section>
      <div class="sec-title">Runs</div>
      <table><tbody id="runs"></tbody></table>
    </section>
    <section>
      <div class="sec-title">Workers</div>
      <table><tbody id="workers"></tbody></table>
    </section>
    <section>
      <div class="sec-title">Pending</div>
      <table><tbody id="pending"></tbody></table>
    </section>
  </div>
  <div class="detail" id="detail">
    <p class="hint" style="padding:16px">Select a run to see its fork tree and thread timelines.</p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const PAGE = 500;
// A parent with more children than this collapses same-function siblings into a
// cluster, so a fan-out of hundreds reads as one node with a count.
const CLUSTER_OVER = 8;
const CLUSTER_MIN = 3;

// Lanes in the trace view are the selected thread and its descendants, capped.
const TIMELINE_LANES = 60;

let selected = null;      // selected run
let infos = [];           // thread headers for the selected run
let selThread = null;     // thread whose timeline is shown
let view = "trace";       // "trace" | "list" — the bottom pane's mode
let selEvent = null;      // {threadId, ev} inspected in the trace's detail strip
const openClusters = new Set();   // "parent|fn" clusters expanded in the diagram
const cursor = {};        // thread id -> paging/render state for the timeline

async function getJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(path + ": " + r.status);
  return r.json();
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function statusEl(s) { return `<span class="status ${esc(s)}">${esc(s)}</span>`; }
function isTerminal(s) { return s === "completed" || s === "failed"; }

async function refreshCluster() {
  try {
    const st = await getJSON("api/status");
    $("chips").innerHTML = [
      ["target", st.target], ["workers", st.workers], ["outstanding", st.outstanding], ["dir", st.dir],
    ].map(([k, v]) => `<span class="chip">${k} <b>${esc(v)}</b></span>`).join("");
  } catch (e) {}
  try {
    const ws = await getJSON("api/workers");
    $("workers").innerHTML = ws.length ? ws.map(w => `<tr>
      <td class="mono">${esc(w.id)}</td><td>${esc(w.kind)}</td>
      <td>${w.dead ? '<span class="dead">dead</span>' : w.draining ? '<span class="draining">draining</span>' : "load " + w.load}</td>
    </tr>`).join("") : `<tr><td class="empty" colspan="3">none</td></tr>`;
  } catch (e) {}
  try {
    const ps = await getJSON("api/pending");
    $("pending").innerHTML = ps.length ? ps.map(p => `<tr>
      <td class="mono">${esc(p.run || p.id)}</td><td>${esc(p.fn || "")}</td>
      <td>${p.blocked ? "blocked" : p.placed ? "placed" : "queued"}</td>
    </tr>`).join("") : `<tr><td class="empty" colspan="3">none</td></tr>`;
  } catch (e) {}
}

async function refreshRuns() {
  try {
    const runs = await getJSON("api/runs");
    $("runs").innerHTML = runs.length ? runs.map(r => `<tr class="run ${r.run === selected ? "sel" : ""}" data-run="${esc(r.run)}">
      <td class="mono">${esc(r.run)}</td><td>${statusEl(r.status)}</td>
    </tr>`).join("") : `<tr><td class="empty" colspan="2">no runs recorded</td></tr>`;
    for (const tr of $("runs").querySelectorAll("tr.run")) tr.onclick = () => selectRun(tr.dataset.run);
  } catch (e) {}
}

async function selectRun(run) {
  selected = run;
  selThread = null;
  infos = [];
  openClusters.clear();
  for (const k in cursor) delete cursor[k];
  for (const tr of $("runs").querySelectorAll("tr.run")) tr.classList.toggle("sel", tr.dataset.run === run);
  await loadHeaders();
  // Open the run on its root thread's timeline.
  const root = infos.find(t => !t.parent || !infos.some(o => o.id === t.parent)) || infos[0];
  if (root) selectThread(root.id);
  else renderDetail();
}

async function loadHeaders() {
  try {
    const detail = await getJSON("api/runs/" + encodeURIComponent(selected));
    infos = detail.threads || [];
  } catch (e) {
    infos = [];
    $("detail").innerHTML = `<p class="hint" style="padding:16px">Could not load ${esc(selected)}: ${esc(e.message)}</p>`;
  }
}

// --- fork tree ---

function childrenOf() {
  const byId = {}, kids = {};
  for (const t of infos) byId[t.id] = t;
  for (const t of infos) {
    const p = t.parent && byId[t.parent] ? t.parent : null;
    if (p) (kids[p] = kids[p] || []).push(t.id);
  }
  const roots = infos.filter(t => !(t.parent && byId[t.parent])).map(t => t.id);
  return { byId, kids, roots };
}

// numeric-aware sort so main.2 precedes main.10.
function sortIds(ids) {
  return ids.slice().sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
}

function renderDetail() {
  const done = infos.filter(t => t.status === "completed").length;
  const failed = infos.filter(t => t.status === "failed").length;
  const running = infos.length - done - failed;
  const sub = infos.length
    ? `${infos.length} threads · ${done} completed${failed ? " · " + failed + " failed" : ""}${running ? " · " + running + " running" : ""}`
    : "no threads";
  $("detail").innerHTML =
    `<div class="diagram-title"><h2 class="mono">${esc(selected)}</h2><span class="sub">${esc(sub)}</span></div>
     <div class="diagram" id="diagram"></div>
     <div class="timeline" id="timeline"></div>`;
  renderTree();
  renderTimeline();
  if (view === "trace" && selThread) ensureLanes();
}

function renderTree() {
  const { kids, roots } = childrenOf();
  const html = `<ul class="tree">${sortIds(roots).map(id => renderNode(id, kids)).join("")}</ul>`;
  $("diagram").innerHTML = html;
  wireTree();
}

function renderNode(id, kids) {
  const children = sortIds(kids[id] || []);
  const items = clusterItems(id, children, kids);
  const sub = items.length ? `<ul>${items.join("")}</ul>` : "";
  return `<li>${box(id)}${sub}</li>`;
}

// clusterItems returns the <li> markup for a node's children: individual nodes
// when few, or same-function clusters when a fan-out is wide. An expanded
// cluster becomes its member nodes plus a collapse tab.
function clusterItems(parent, children, kids) {
  if (children.length <= CLUSTER_OVER) return children.map(id => renderNode(id, kids));
  const byFn = {};
  for (const id of children) {
    const fn = (infos.find(t => t.id === id) || {}).fn || "";
    (byFn[fn] = byFn[fn] || []).push(id);
  }
  const out = [];
  for (const fn of Object.keys(byFn).sort()) {
    const ids = byFn[fn];
    const key = parent + "|" + fn;
    if (ids.length < CLUSTER_MIN) { out.push(...ids.map(id => renderNode(id, kids))); continue; }
    if (openClusters.has(key)) {
      out.push(`<li><button class="cluster-collapse" data-cluster="${esc(key)}">▾ ${esc(fn || "thread")} ×${ids.length} — collapse</button></li>`);
      out.push(...sortIds(ids).map(id => renderNode(id, kids)));
    } else {
      out.push(`<li>${clusterBox(key, fn, ids)}</li>`);
    }
  }
  return out;
}

function box(id) {
  const t = infos.find(x => x.id === id) || { id, status: "running" };
  const sel = id === selThread ? " sel" : "";
  const att = t.attempts > 1 ? `<span class="att">⟳${t.attempts}</span>` : "";
  return `<button class="box ${esc(t.status)}${sel}" data-thread="${esc(id)}">
    <div class="id">${esc(id)}</div>
    ${t.fn ? `<div class="fn">${esc(t.fn)}</div>` : ""}
    <div class="row2"><span class="dot"></span>${statusEl(t.status)}${att}</div>
  </button>`;
}

function clusterBox(key, fn, ids) {
  let good = 0, bad = 0, warn = 0;
  for (const id of ids) {
    const s = (infos.find(t => t.id === id) || {}).status;
    if (s === "completed") good++; else if (s === "failed") bad++; else warn++;
  }
  const bar = (n, cls) => n ? `<span class="bar ${cls}" style="flex:${n}"></span>` : "";
  const parts = [good && good + " ✓", bad && bad + " ✗", warn && warn + " …"].filter(Boolean).join("  ");
  return `<button class="box cluster" data-cluster="${esc(key)}">
    <div class="id"><span class="count">×${ids.length}</span> ${esc(fn || "threads")}</div>
    <div class="fn">${esc(parts)}</div>
    <div class="bars">${bar(good, "good")}${bar(warn, "warn")}${bar(bad, "bad")}</div>
    <div class="fn" style="margin-top:3px">▸ expand</div>
  </button>`;
}

function wireTree() {
  const d = $("diagram");
  for (const b of d.querySelectorAll(".box[data-thread]")) b.onclick = () => selectThread(b.dataset.thread);
  for (const b of d.querySelectorAll("[data-cluster]")) b.onclick = () => {
    const k = b.dataset.cluster;
    if (openClusters.has(k)) openClusters.delete(k); else openClusters.add(k);
    renderTree();
  };
}

// --- selected thread timeline ---

function newCursor(id) {
  const t = infos.find(x => x.id === id) || {};
  return { next: 0, done: false, terminal: isTerminal(t.status), loaded: 0, loading: false,
    attempts: t.attempts, events: [], expanded: new Set() };
}

function selectThread(id) {
  selThread = id;
  selEvent = null;
  if (!cursor[id]) cursor[id] = newCursor(id);
  renderDetail();
  if (view === "list" && cursor[id].loaded === 0 && !cursor[id].done) loadMore(id);
}

async function loadMore(id) {
  const c = cursor[id];
  if (!c || c.loading || (c.done && c.terminal)) return;
  c.loading = true;
  renderTimeline();
  try {
    const page = await getJSON(`api/runs/${encodeURIComponent(selected)}/threads/${encodeURIComponent(id)}?from=${c.next}&limit=${PAGE}`);
    for (const ev of (page.events || [])) c.events.push(ev);
    c.next = page.next; c.done = page.done; c.loaded += (page.events || []).length;
  } catch (e) {}
  finally { c.loading = false; if (id === selThread) renderTimeline(); }
}

// fetchAll pages a thread's whole recorded history (the trace view needs every
// event, not one page); it stops at what is recorded so far on a running thread.
async function fetchAll(id) {
  const c = cursor[id] || (cursor[id] = newCursor(id));
  if (c.fetching) return;
  c.fetching = true;
  try {
    for (;;) {
      const page = await getJSON(`api/runs/${encodeURIComponent(selected)}/threads/${encodeURIComponent(id)}?from=${c.next}&limit=${PAGE}`);
      const evs = page.events || [];
      for (const ev of evs) c.events.push(ev);
      c.next = page.next; c.done = page.done; c.loaded += evs.length;
      if (evs.length < PAGE) break;
    }
  } catch (e) {} finally { c.fetching = false; }
}

// ensureLanes loads the trace's lane threads, re-rendering as each arrives.
async function ensureLanes() {
  const lanes = laneThreads();
  await Promise.all(lanes.map(async id => {
    const c = cursor[id];
    if (c && (c.fetching || (c.done && c.terminal))) return;
    await fetchAll(id);
    if (view === "trace" && selThread) renderTimeline();
  }));
  if (view === "trace" && selThread) renderTimeline();
}

// laneThreads is the selected thread plus its descendants, depth-first, capped.
function laneThreads() {
  if (!selThread) return [];
  const { kids } = childrenOf();
  const out = [];
  const walk = id => {
    if (out.length >= TIMELINE_LANES) return;
    out.push(id);
    for (const k of sortIds(kids[id] || [])) walk(k);
  };
  walk(selThread);
  return out;
}

function chanOf(ev) {
  if (ev.kind === "send" || ev.kind === "recv") {
    const m = /^(?:close\s+)?([^\s#]+)/.exec(ev.detail || "");
    return m ? m[1] : "";
  }
  return "";
}

function evRow(ev) {
  let detail = esc(ev.detail);
  if (ev.kind === "fork") {
    const child = (ev.detail || "").split(" ")[0];
    detail = `<a class="fork-link" data-to="${esc(child)}">${esc(ev.detail)}</a>`;
  }
  const val = ev.value ? `<div class="val"><span class="tag">value</span>${esc(ev.value)}</div>` : "";
  return `<div class="ev">
    <span class="seq">${ev.seq}</span>
    <span class="kind ${esc(ev.kind)}">${esc(ev.kind)}</span>
    <span class="detail">${detail}${ev.error ? ` <span class="err">${esc(ev.error)}</span>` : ""}${val}</span>
  </div>`;
}

function renderTimeline() {
  const el = $("timeline");
  if (!el) return;
  if (!selThread) { el.innerHTML = `<p class="hint">Select a thread in the diagram above to see its events.</p>`; return; }
  const c = cursor[selThread];
  const t = infos.find(x => x.id === selThread) || { id: selThread, status: "running" };

  const counts = {};
  for (const ev of c.events) counts[ev.kind] = (counts[ev.kind] || 0) + 1;
  const summary = Object.keys(counts).sort().map(k => `${esc(k)} <span class="n">${counts[k]}</span>`).join(" · ");

  el.innerHTML = `<div class="tl-head">
      <span class="id">${esc(t.id)}</span>
      ${t.fn ? `<span class="fn">${esc(t.fn)}</span>` : ""}
      ${statusEl(t.status)}
      ${t.attempts > 1 ? `<span class="att" style="color:var(--warn)">⟳ attempt ${t.attempts}</span>` : ""}
      <span class="views">
        <button data-view="trace" class="${view === "trace" ? "on" : ""}">Timeline</button>
        <button data-view="list" class="${view === "list" ? "on" : ""}">List</button>
      </span>
      <span class="summary">${c.loaded}${c.done ? "" : "+"} events${summary ? " · " + summary : ""}</span>
    </div>
    <div id="tl-body"></div>`;

  for (const b of el.querySelectorAll(".views button")) b.onclick = () => {
    if (view === b.dataset.view) return;
    view = b.dataset.view;
    selEvent = null;
    renderTimeline();
    if (view === "trace") ensureLanes();
    else if (c.loaded === 0 && !c.done) loadMore(selThread);
  };

  if (view === "trace") renderTrace();
  else renderList();
}

function renderList() {
  const el = $("tl-body");
  if (!el) return;
  const c = cursor[selThread];

  // Consecutive events of one kind on one channel collapse into an expandable
  // group; an event with an error stays its own row so a failure is never hidden.
  const groups = [];
  for (const ev of c.events) {
    const key = ev.kind + "|" + chanOf(ev);
    const last = groups[groups.length - 1];
    if (last && last.key === key && !ev.error && !last.items[last.items.length - 1].error) last.items.push(ev);
    else groups.push({ key, kind: ev.kind, chan: chanOf(ev), gid: key + "|" + ev.seq, items: [ev] });
  }
  const rows = groups.map(g => {
    if (g.items.length === 1) return evRow(g.items[0]);
    const first = g.items[0], last = g.items[g.items.length - 1];
    const open = c.expanded.has(g.gid);
    const label = `${esc(g.kind)}${g.chan ? " " + esc(g.chan) : ""} ×${g.items.length}`;
    return `<div class="grp" data-gid="${esc(g.gid)}">
      <div class="ev grp-head">
        <span class="seq">${first.seq}–${last.seq}</span>
        <span class="kind ${esc(g.kind)}">${open ? "▾" : "▸"} ${label}</span>
        <span class="detail hint">${esc(first.detail)} … ${esc(last.detail)}</span>
      </div>
      <div class="grp-body"${open ? "" : " hidden"}>${g.items.map(evRow).join("")}</div>
    </div>`;
  }).join("");

  let more = "";
  if (!(c.done && c.terminal)) {
    more = `<button class="more" id="more"${c.loading ? " disabled" : ""}>${c.loading ? "Loading…" : c.done ? "Load newer" : "Load more"}</button>`;
  } else if (c.loaded === 0) {
    more = `<p class="hint">No events recorded on this thread.</p>`;
  }

  el.innerHTML = `<div class="events">${rows || (c.loading ? '<div class="ev"><span></span><span></span><span class="hint">loading…</span></div>' : "")}</div>${more}`;

  const cont = el.querySelector(".events");
  for (const gh of cont.querySelectorAll(".grp-head")) gh.onclick = () => {
    const gid = gh.parentElement.dataset.gid;
    if (c.expanded.has(gid)) c.expanded.delete(gid); else c.expanded.add(gid);
    renderTimeline();
  };
  for (const a of cont.querySelectorAll(".fork-link")) a.onclick = () => {
    const to = a.dataset.to;
    if (infos.some(t => t.id === to)) { revealInTree(to); selectThread(to); }
  };
  const mb = el.querySelector("#more");
  if (mb) mb.onclick = () => loadMore(selThread);
}

// laneItems turns a thread's events into positioned spans (a call's
// CallEvent→ReturnEvent) and point markers (everything else), keyed for the
// detail strip. Calls nest LIFO since a call blocks its thread until it returns.
function laneItems(events) {
  const spans = [], marks = [], open = [];
  for (const ev of events) {
    const at = Date.parse(ev.at);
    if (ev.kind === "call") { open.push({ ev, at }); continue; }
    if (ev.kind === "return") {
      const c = open.pop();
      spans.push({ start: c ? c.at : at, end: at, ev, openEv: c ? c.ev : null });
      continue;
    }
    marks.push({ kind: ev.kind, at, ev });
  }
  for (const c of open) spans.push({ start: c.at, end: null, ev: c.ev, running: true });
  return { spans, marks };
}

function renderTrace() {
  const el = $("tl-body");
  if (!el) return;
  const lanes = laneThreads();
  const per = lanes.map(id => ({ id, t: infos.find(x => x.id === id) || { id, status: "running" },
    c: cursor[id], items: laneItems((cursor[id] || {}).events || []) }));

  let lo = Infinity, hi = -Infinity;
  for (const p of per) {
    for (const s of p.items.spans) { lo = Math.min(lo, s.start); hi = Math.max(hi, s.end || s.start); }
    for (const m of p.items.marks) { lo = Math.min(lo, m.at); hi = Math.max(hi, m.at); }
  }
  const loading = per.some(p => !p.c || p.c.fetching || !p.c.done);
  if (!isFinite(lo)) {
    el.innerHTML = loading ? `<p class="hint" style="padding:8px 2px">Loading timeline…</p>`
      : `<p class="hint" style="padding:8px 2px">No timed events on this thread or its descendants.</p>`;
    return;
  }
  if (hi <= lo) hi = lo + 1;
  const span = hi - lo;
  const pct = t => ((t - lo) / span * 100);

  const ticks = [];
  for (let i = 0; i <= 5; i++) {
    const f = i / 5;
    ticks.push(`<span class="tick" style="left:${(f * 100).toFixed(3)}%">${fmtOffset(f * span)}</span>`);
  }

  const laneHTML = per.map(p => {
    const spans = p.items.spans.map(s => {
      const l = pct(s.start), r = s.end == null ? pct(hi) : pct(s.end);
      const cls = s.running ? "span running" : (s.ev.error ? "span bad" : "span");
      const title = `${esc((s.openEv || s.ev).detail || "call")}${s.end ? " · " + fmtDur(s.end - s.start) : " · running"}`;
      return `<div class="${cls}" style="left:${l.toFixed(3)}%;width:${Math.max(0.3, r - l).toFixed(3)}%"
        data-thread="${esc(p.id)}" data-seq="${s.ev.seq}" title="${title}"></div>`;
    }).join("");
    const marks = p.items.marks.map(m => {
      const cls = "mark " + esc(m.kind) + (m.ev.error ? " err" : "");
      return `<div class="${cls}" style="left:${pct(m.at).toFixed(3)}%"
        data-thread="${esc(p.id)}" data-seq="${m.ev.seq}" title="${esc(m.ev.detail || m.kind)}"></div>`;
    }).join("");
    const selCls = p.id === selThread ? " sel" : "";
    return `<div class="lane ${esc(p.t.status)}">
      <div class="label${selCls}" data-thread="${esc(p.id)}" title="${esc(p.id)}${p.t.fn ? " — " + esc(p.t.fn) : ""}">
        <span class="dot"></span>${esc(p.id)}
      </div>
      <div class="track">${spans}${marks}</div>
    </div>`;
  }).join("");

  el.innerHTML = `<div class="trace" style="--lane-label:150px">
      <div class="ruler">${ticks.join("")}</div>
      ${laneHTML}
    </div>
    ${loading ? `<div class="trace-more">loading lanes…</div>` : ""}
    ${renderInspect()}`;

  const tr = el.querySelector(".trace");
  for (const lab of tr.querySelectorAll(".label[data-thread]")) lab.onclick = () => {
    const to = lab.dataset.thread;
    if (to !== selThread) { revealInTree(to); selectThread(to); }
  };
  for (const it of tr.querySelectorAll("[data-seq]")) it.onclick = () => {
    const c = cursor[it.dataset.thread];
    const ev = c && c.events.find(e => String(e.seq) === it.dataset.seq);
    if (ev) { selEvent = { threadId: it.dataset.thread, ev }; renderTrace(); }
  };
  const cl = el.querySelector(".insp .close");
  if (cl) cl.onclick = () => { selEvent = null; renderTrace(); };
}

function renderInspect() {
  if (!selEvent) return "";
  const { threadId, ev } = selEvent;
  const val = ev.value ? `<pre>${esc(ev.value)}</pre>` : "";
  const err = ev.error ? `<div class="d err">${esc(ev.error)}</div>` : "";
  return `<div class="insp">
    <button class="close" title="close">×</button>
    <div class="row">
      <span class="kind ${esc(ev.kind)}">${esc(ev.kind)}</span>
      <span class="t">${esc(threadId)} · #${ev.seq} · ${esc(new Date(ev.at).toLocaleTimeString())}</span>
    </div>
    ${ev.detail ? `<div class="d" style="margin-top:4px">${esc(ev.detail)}</div>` : ""}
    ${err}${val}
  </div>`;
}

function fmtOffset(ms) {
  if (ms < 1000) return Math.round(ms) + "ms";
  if (ms < 60000) return (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + "s";
  const m = Math.floor(ms / 60000); return m + "m" + Math.round((ms % 60000) / 1000) + "s";
}
function fmtDur(ms) { return ms < 1 ? "<1ms" : fmtOffset(ms); }

// revealInTree expands whatever cluster hides a thread, so selecting it from a
// fork link (or search) shows it in the diagram.
function revealInTree(id) {
  const t = infos.find(x => x.id === id);
  if (!t || !t.parent) return;
  const key = t.parent + "|" + (t.fn || "");
  const { kids } = childrenOf();
  if ((kids[t.parent] || []).length > CLUSTER_OVER) openClusters.add(key);
}

// A tick refreshes the sidebar, and the diagram's statuses when the selected
// run's thread set is unchanged; a new fork rebuilds it.
async function tick() {
  await Promise.all([refreshCluster(), refreshRuns()]);
  if (!selected) return;
  let fresh = [];
  try {
    const detail = await getJSON("api/runs/" + encodeURIComponent(selected));
    fresh = detail.threads || [];
  } catch (e) { return; }
  const ids = fresh.map(t => t.id), old = infos.map(t => t.id);
  const changed = ids.length !== old.length || ids.some((v, i) => v !== old[i]);
  infos = fresh;
  if (changed) {
    if (selThread && !infos.some(t => t.id === selThread)) selThread = null;
    renderDetail();
  } else {
    // statuses may have advanced; refresh the diagram boxes and timeline head.
    for (const t of infos) { const c = cursor[t.id]; if (c) { c.terminal = isTerminal(t.status); c.attempts = t.attempts; } }
    renderTree();
    renderTimeline();
    if (view === "trace" && selThread) ensureLanes();
  }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
